name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Build Windows .exe Installer & Portable
        run: npx --yes electron-builder --win nsis portable --config.electronVersion=33.2.0 --config.directories.output=dist_electron

      - name: Upload .EXE as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinPDF-Studio-Pro-Windows-EXE
          path: dist_electron/*.exe
          retention-days: 30
          if-no-files-found: warn

